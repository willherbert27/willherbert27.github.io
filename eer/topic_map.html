<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="An interactive map of the topics published in the Journal of Engineering Education, 2015-2026.">
<title>JEE Topic Map</title>
<style>
:root{--bg:#fcfcfb;--panel:#f2f2ee;--line:#dcdcd4;--ink:#0b0b0b;--muted:#52514e;
  --accent:#2a78d6;--noise:#8a8984;color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-block:14px;padding-inline:16px;max-width:900px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:10px;font-size:13px}
.controls label{display:inline-flex;gap:5px;align-items:center;cursor:pointer;min-height:32px}
.controls input[type=search]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);flex:1 1 12em;min-width:10em;min-height:32px}
.plot{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.plot.drag{cursor:grabbing}
svg{display:block;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;max-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.toolbar{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.toolbar button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:32px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);cursor:pointer;font-size:12.5px;min-height:32px;line-height:1.2}
.tchip[aria-pressed="true"]{border-color:var(--ink);background:var(--bg);font-weight:600}
.tchip .sw{width:11px;height:11px;border-radius:50%;flex:none}
.tchip .n{color:var(--muted);font-variant-numeric:tabular-nums}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:12px;scroll-margin-top:8px}
.box h2{font-size:15px;margin:0 0 6px;line-height:1.35}
.box h3{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.box dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0 0}
.box dt{color:var(--muted)}
.box dd{margin:0;overflow-wrap:anywhere}
.box a{color:var(--accent)}
.pill{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;color:#fff}
.terms{color:var(--muted);font-size:12.5px;margin:6px 0 0;overflow-wrap:anywhere}
.empty{color:var(--muted)}
.foot{color:var(--muted);font-size:12px;margin-top:10px}
.foot b{color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){
  body{padding-inline:12px}
  h1{font-size:18px}
  .plot{aspect-ratio:1/1.15}
  .tchip{font-size:12px;padding:5px 9px}
}
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="sub" id="sub"></p>
<div class="controls">
  <span>Colour by</span>
  <label><input type="radio" name="mode" value="topic" checked> topic</label>
  <label><input type="radio" name="mode" value="year"> year</label>
  <label><input type="checkbox" id="noise"> show unclustered</label>
  <input type="search" id="q" placeholder="title, author or DOI…" aria-label="filter by title, author or DOI">
</div>
<div class="plot" id="plot">
  <svg id="svg" viewBox="0 0 800 800" role="img" aria-label="Map of engineering education research papers. Drag to pan, pinch or scroll to zoom, tap a point for its paper."><g id="view"></g></svg>
  <div class="toolbar"><button type="button" id="zin" aria-label="zoom in">+</button><button type="button" id="zout" aria-label="zoom out">−</button><button type="button" id="reset">Reset</button></div>
  <div class="tip" id="tip" hidden></div>
</div>
<div class="legend" id="legend"></div>
<section class="box" id="detail"><h3>Paper</h3><p class="empty">Tap a point to see its paper. Tap a topic below to isolate it.</p></section>

elf‐efficacy and engineering identity, contributing to persistence intentions in and beyond the engineering degree", "a": "Madalyn Wilson‐Fetrow, Vanessa Svihla, Ruben Lopez‐Parra, Yu‐Yu Hsiao", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70066", "x": 6.372, "y": 7.767, "c": 4, "t": "Automating creativity assessment in engineering design: A psychometric validation of\n                    <scp>AI<\/scp>\n                    ‐generated items of the design problem task", "a": "Simone A. Luchini, Roger E. Beaty, Ayesha S. Boyce, Sarah E. Zappe, Boris Forthmann", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70067", "x": 6.726, "y": 8.88, "c": 4, "t": "Developing indices to study engineers' interest, confidence, and experience with global engineering work activities", "a": "Lexy Arinze, Joe Tort, Kirsten A. Davis", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70064", "x": 6.282, "y": 11.826, "c": 11, "t": "Enhancing students' engineering identities through a Research Experiences for Undergraduates program", "a": "Elise J. Cain, Regina P. McCurdy, Jenay F. Willis, Valentin Soloiu", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70070", "x": 7.42, "y": 11.705, "c": -1, "t": "Servingness fractured and labored: A Latina's journey of negotiating belongingness under the guise of a Hispanic‐Serving Institution", "a": "Dina Verdín", "yr": 2026, "dt": "research article", "nc": 1}, {"d": "10.1002/jee.70071", "x": 5.504, "y": 8.845, "c": 6, "t": "Correction to “Assessing Interdisciplinary Learning and Knowledge: A State‐of‐the‐Art Review and Heuristic”", "a": "", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70073", "x": 4.556, "y": 10.214, "c": 5, "t": "Institutionalizing Interdisciplinary Engineering Education: Institutional work and emerging pathways in China's School of Future Technology initiative", "a": "Lina Zheng, Ying Lu, Yu Han", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70072", "x": 5.338, "y": 10.599, "c": -1, "t": "Transactional schooling and consequential learning: The dual object model of engineering department culture", "a": "Lorena S. Grundy, Milo D. Koretsky", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70074", "x": 4.27, "y": 10.196, "c": 5, "t": "Vertical alignment as a systemic strategy for sustaining workforce‐aligned K–12 engineering initiatives: A collective case study of district‐wide microelectronics integration", "a": "Greg J. Strimel, Victoria Constantine, Deana Lucas, Emily M. Haluschak, Yubin Lee, Morgan M. Hynes, S. Selcen Guzey, Tamara J. Moore", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70075", "x": 6.814, "y": 12.21, "c": 11, "t": "Achieved, in progress, deferred: Sociocultural conditions shaping Latinx students' engineering identity", "a": "A. Lili Castillo, Dina Verdín", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70076", "x": 4.633, "y": 10.938, "c": 6, "t": "Making sociotechnical doable: Cross‐disciplinary translations into engineering education", "a": "Desen S. Özkan, Kari Zacharias, Marie Stettler Kleine", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70078", "x": 7.581, "y": 12.091, "c": -1, "t": "Theory and theoretical framework use for engineering education research: A systematic review of undergraduate disability research in the United States", "a": "Mariel A. Pfeifer, Ariel Chasen, Maura Borrego", "yr": 2026, "dt": "review article", "nc": 0}, {"d": "10.1002/jee.70083", "x": 5.746, "y": 11.29, "c": 0, "t": "Beyond parents and educators: Older siblings as influential figures in nonformal engineering contexts", "a": "Amber Simpson, Sawsan Werfelli, Kelli Paul", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70080", "x": 8.611, "y": 12.519, "c": 7, "t": "Transfer composition: An exploration of transfer student access in engineering", "a": "Dustin M. Grote, David B. Knight", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70081", "x": 7.252, "y": 9.52, "c": 14, "t": "Engineering curricular analytics as complex systems: Introducing, modeling, and empirically testing the sociotechnical curricular complexity (STCC) framework", "a": "Mohammed A. Alrizqi, Allison Godwin", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70079", "x": 7.438, "y": 12.522, "c": 11, "t": "“I felt like my voice literally did not matter”—Recognition and engineering identity experiences of Black undergraduate women in biomedical engineering", "a": "Annie Y. Patrick, Joseph LeDoux, Sara Schley", "yr": 2026, "dt": "research article", "nc": 0}, {"d": "10.1002/jee.70082", "x": 4.288, "y": 11.021, "c": 6, "t": "Making space for expansive thinking in sociotechnical undergraduate discussions", "a": "Fatima Rahman, Kristen Wendell, Chelsea J. Andrews", "yr": 2026, "dt": "research article", "nc": 0}], "topics": [{"id": 6, "label": "Sociotechnical Thinking and Social Responsibility", "n": 63, "colour": "#6c004f", "terms": ["cbl", "dei", "ethics dei", "eer", "sociotechnical", "public welfare", "welfare", "empathy", "moral", "numeracy"], "why": "The distinguishing terms cluster around two tightly linked ideas: (1) sociotechnical thinking/awareness (terms: sociotechnical, sociotechnical thinking, boundary spanning, complexity) and (2) the ethical-social obligations of engineers (terms: public welfare, social responsibility, community engagement, empathy, moral, ethical reasoning, DEI, ethics). The central papers reinforce both halves directly—two papers on sociotechnical thinking in the classroom, one on community engagement, one on social justice, one on responsibility/agency in CBL, and one on the ethics-DEI intersection. Together they form a coherent topic on cultivating engineers' awareness of technology-in-society and their ethical responsibility to communities and the public welfare."}, {"id": 11, "label": "Underrepresented Student Identity in Engineering", "n": 45, "colour": "#a2766a", "terms": ["disability", "black women", "navajo", "ccw", "navigational", "makerspace", "emilia", "roger", "makerspaces", "shame"], "why": "The distinguishing terms cluster around Yosso's Community Cultural Wealth framework (navigational capital, aspirational capital, familial capital, ccw, yosso) and intersectional identity markers (black women, woce, navajo, disability, disabled, accommodations). The nearest papers all examine how students marginalized by race, gender, or disability construct, negotiate, and experience engineering identity—through recognition, counterspaces, and sociocultural conditions. The shared focus is not on a pedagogy or a technology but on the identity formation and belonging of underrepresented engineering students, making this label specific to the cluster rather than a generic engineering-education term."}, {"id": 1, "label": "Epistemic Reasoning in Engineering Design", "n": 41, "colour": "#8c3cff", "terms": ["epistemic", "mr", "intuition", "pbl", "metacognition", "ebr", "mr evans", "epistemic beliefs", "meta-affect", "iterative practices"], "why": "The distinguishing terms cluster around epistemic beliefs, metacognition, mechanistic and evidence-based reasoning, argumentation, and iterative practices. The nearest papers all examine how students (from elementary through undergraduate) develop, enact, or reflect on reasoning and beliefs about knowledge within engineering design and problem-solving contexts—epistemic network analyses of design learning, evidence-based reasoning in design discourse, mechanistic reasoning recognition, reflective decision-making, and beliefs about problem solving. The shared focus is not the design artefact or the pedagogical structure per se, but the epistemic and reasoning processes students deploy while designing."}, {"id": 4, "label": "Psychometric Instrument Development and Validation", "n": 25, "colour": "#e7a500", "terms": ["sjt", "gtp", "gec", "ai", "synthetic data", "llms", "synthetic", "llm", "size scale", "generic skills"], "why": "Every paper in this cluster centres on creating or validating a measurement instrument (scale, test, questionnaire) for engineering education. The distinguishing terms are dominated by psychometric vocabulary—EFA, CFA, size scale (IRT), rubric, indices, reliability/validity markers—and by the acronyms of specific instruments (SJTs, GTP, GEC, REI, EFT, JESIEK, SIL). The titles reinforce this: 'Creating an Instrument,' 'validation study,' 'Validated and Reliable Instrument,' 'Validation evidence,' 'instrument development,' and 'Building evidence of validity.' The shared task is the design, psychometric validation, and reporting of assessment measures, not the instructional practices or student populations they happen to target."}, {"id": 16, "label": "Engineering Career Choice Motivation", "n": 25, "colour": "#0774d8", "terms": ["career values", "sector", "communal", "agentic", "agentic communal", "person orientation", "communal career", "entrepreneurial", "emi", "entrepreneurial intent"], "why": "The distinguishing terms cluster around motivational and psychological constructs—expectancy-value, social cognitive career theory (SCCT), achievement goals, future time perspectives (FTP), outcome expectations, effort beliefs, identity, communal/agentic career orientations, and entrepreneurial intent. The nearest papers all model or predict why students do or do not pursue engineering (or graduate study) as a career: an affective model of career choice, the multiplicative expectancy-value function, the 'psychological cost' calculus, identity-based motivation linked to future-time perspectives, and factors underlying graduate-school decisions. Together they form a coherent research topic: the motivational and identity-based psychological processes that drive engineering career choice."}, {"id": 2, "label": "Engineering Representations and Spatial Cognition", "n": 17, "colour": "#028800", "terms": ["shear", "spatial ability", "bending moment", "mental rotation", "shear force", "bending", "wml", "hegarty", "thermodynamics", "automaticity"], "why": "The cluster is anchored by two intertwined threads. First, a strong representational focus: paper titles explicitly address 'visual representations,' 'engineering representations,' 'representational competencies,' and 'physical and virtual manipulatives,' while distinguishing terms include 'drawing prompts,' 'vr,' and 'schema.' Second, a spatial-cognition thread: terms like 'spatial ability,' 'mental rotation,' 'rotation skills,' 'wmt' (Witkin's Mental Rotations Test), and 'hegarty' (the key researcher on spatial ability in STEM) cluster tightly. The content domain is predominantly statics/mechanics (shear, bending moment, equilibrium, force bending), with a secondary thermodynamics subset (oem-thermo, heat, piston). Together these terms and titles point to research on how students construct, interpret, and manipulate visual/physical/virtual representations and how spatial reasoning ability mediates their problem-solving and conceptual change in engineering courses—distinct from broader pedagogical approaches or purely content-focused clusters."}, {"id": 10, "label": "Engineering Graduate Attrition and Persistence", "n": 14, "colour": "#0000dd", "terms": ["berdanier", "woc", "sallai", "zerbe", "woc faculty", "professorial", "professorial intentions", "degree completion", "completion intentions", "graduate attrition"], "why": "The distinguishing terms (graduate attrition, degree completion, completion intentions, critical events, thriving, disenchantment, advisor relationship, professorial intentions) and the nearest papers all centre on why engineering graduate students persist, complete, or leave their programs. Papers explicitly examine critical events as attrition catalysts, persistence costs, structural causes of attrition, doctoral socialization, academic disenchantment, and survival/thriving dynamics. The cluster is unified by the narrative of navigating the graduate experience toward either completion (and often professorial intentions) or departure."}, {"id": 15, "label": "Predicting Engineering Major Choice and Persistence", "n": 12, "colour": "#790000", "terms": ["e-cte", "term gpa", "major choice", "fa term", "ap stem", "eng cs", "sp term", "stem major", "mathematics course", "sat math"], "why": "The distinguishing terms centre on 'major choice,' 'major selection,' 'stem major,' 'eng cs,' and term-specific GPA metrics (fa, sp), while the nearest papers all model who selects an engineering/CS major and who persists to graduation. The cluster's unique fingerprint is the combination of pre-college and early-college predictors (AP STEM, SAT/ACT math, calculus placement, CTE, high-school demographics, family assets) fed into large-scale predictive analyses (random forest, machine learning) to forecast major selection and retention. This sets it apart from clusters focused on pedagogical interventions, curriculum design, or student outcomes without a selection/persistence framing."}, {"id": 9, "label": "Mental Health and Help-Seeking in Engineering", "n": 9, "colour": "#15e18d", "terms": ["help-seeking", "mhw", "health help-seeking", "lipson", "help seeking", "health treatment", "treatment use", "seeking help", "distress", "hardness"], "why": "The distinguishing terms are overwhelmingly centred on mental health (mhw, mhc, mhcs, distress, anxiety depression, symptoms, health treatment) and help-seeking behaviour (help-seeking, seeking help, health professional, treatment use). Every paper at the cluster centre examines undergraduate or graduate engineering students' mental health and their attitudes, barriers, or instrument-based measures of help-seeking. The repeated focus on engineering-specific culture (stress culture, engineering identity, inclusion) and named scales (UE-MH-HSI, MHC, MHCS) ties these studies to the engineering education context rather than general student wellness, making 'Mental Health and Help-Seeking in Engineering' the precise shared topic."}, {"id": 0, "label": "Engineering Identity in Young Diverse Learners", "n": 8, "colour": "#d70000", "terms": ["sibling", "siblings", "migratory", "cindy", "aguirre-", "simpson", "kindergarten", "walt", "gold", "older siblings"], "why": "The cluster is unified by a focus on engineering identity formation among very young children (pre-K, kindergarten, second grade) and linguistically/culturally minoritized students (ELLs, migratory Latinx students). Distinguishing terms like 'kindergarten,' 'prekindergarten,' 'preschool,' 'early childhood,' 'els/ells,' 'migratory,' and 'culturally responsive' point to these two overlapping populations. The nearest papers confirm this: they examine engineering identity, funds of knowledge, and self-efficacy in kindergarten through early elementary settings, as well as in culturally responsive and informal/out-of-school contexts (siblings as influencers, child–adult interactions, engineering play with blocks). The emphasis on identity, culture, and developmental stage rather than on specific technologies or curricular methods distinguishes this cluster from, say, prototyping or maker-based clusters."}, {"id": 3, "label": "Concept Maps and Concept Inventory Assessment", "n": 7, "colour": "#00acc7", "terms": ["concept maps", "concept map", "concept mapping", "cognitive style", "em ise", "ise", "cross-links", "cats", "defranco", "holistic scoring"], "why": "The distinguishing terms cluster tightly around two families of instruments—concept maps (cross-links, nodes, Novak, Defranco) and concept inventories (ISE, EM ISE, DCI, IRT, precourse/postcourse)—along with the scoring and validity questions attached to both (holistic, categorical, and traditional scoring; judges; cognitive style moderators). The six nearest papers confirm this: four are explicitly about concept-map scoring, measurement, or cognitive-style effects, and two address concept-inventory scoring and validity. The shared research activity is not the engineering discipline itself but the *assessment methodology* for measuring students' conceptual knowledge with these two instrument types."}, {"id": 7, "label": "Engineering Transfer Student Transitions and Persistence", "n": 7, "colour": "#583b00", "terms": ["transfer composition", "veterans", "post-transfer", "transfer shock", "sves", "receiving institution", "shock", "tsm", "stickiness", "transfer pathways"], "why": "The cluster is overwhelmingly defined by the term 'transfer' in its many forms (transfer shock, transfer persistence, transfer pathways, transfer composition, transfer process, vertical/lateral transfer, post-transfer). The nearest papers all examine what happens when engineering students move between institutions: the adjustment period (transfer shock), whether they stay (persistence, stickiness), their access and composition, and their graduation outcomes. Military veterans and Black students appear as specific sub-populations of transfer students. The combination of 'transitions' (capturing shock, pathways, the transfer process itself) and 'persistence' (capturing stickiness, graduation rates, staying) covers the full range of distinguishing terms without over-generalizing to all engineering education topics."}, {"id": 13, "label": "Belonging and Identity in Engineering", "n": 7, "colour": "#c004b9", "terms": ["bli", "invariance", "supports belonging", "classroom engagement", "dhopade", "taumata", "waipapa", "waipapa taumata", "taumata rau", "u-mics"], "why": "The distinguishing terms cluster around two intertwined constructs—academic belonging (\"supports belonging,\" \"academic belonging,\" \"welcoming climate\") and engineering identity formation (\"u-mics,\" \"crocetti,\" \"reconsideration commitment\")—with psychometric validation indicators (\"cfi,\" \"rmsea,\" \"invariance\") pointing to measurement-invariance testing across demographic subgroups (\"asian subgroups,\" \"nondominant\"). The nearest papers confirm this: they examine sense of inclusion at Waipapa Taumata Rau, belonging predictors, engineering identity via the Utrecht-Management of Identity Commitments Scale, climate for marginalized groups, and engagement of Asian American students. Together they form a coherent cluster on how marginalized and diverse engineering students experience belonging and construct professional identity, and how those constructs are measured across groups."}, {"id": 14, "label": "Co-Curricular and Out-of-Class Learning Experiences", "n": 7, "colour": "#645473", "terms": ["sustainability-related", "cocurricular", "leadership skills", "essc", "esscs", "cocurricular participation", "leq", "proactive behaviors", "alrizqi", "stcc"], "why": "The distinguishing terms heavily feature 'cocurricular' (participation, activities, support), 'out-of-class' (activities), 'OTL' (opportunities to learn), 'proactive behaviors,' and 'leadership development.' The nearest papers consistently examine how experiences beyond formal coursework—co-curricular activities, college-wide experiences, and out-of-class engagement—influence engineering student outcomes in leadership, sustainability learning, and overall development. The STCC paper extends this to modeling the complexity of curricular and co-curricular structures. Together, the cluster centers on the design, measurement, and impact of non-classroom learning experiences in engineering programs."}, {"id": 5, "label": "Institutional Work and Interorganizational Collaboration", "n": 6, "colour": "#ff7fd1", "terms": ["ai", "microelectronics", "sfts", "institutional work", "iee", "gillen", "legitimacy", "vertical alignment", "district-wide", "pamela"], "why": "The distinguishing terms center on organizational and institutional theory: 'institutional work,' 'legitimacy,' 'social rules,' 'enablements,' 'levers,' and 'collaborations.' The nearest papers consistently examine how engineering education is enacted, legitimized, and sustained through organizational processes—interorganizational industry partnerships, structuration-theory analyses of collaboration norms, institutionalization of new school structures, vertical alignment across K–12 districts, and collaborative curriculum construction. The cluster is distinguished from hands-on or pedagogical clusters by its focus on the meso- and macro-level mechanisms (district-wide systems, interorganizational coordination, institutional rule-making) through which engineering education is implemented at scale."}, {"id": 8, "label": "Pandemic Emergency Remote Learning Transition", "n": 6, "colour": "#005759", "terms": ["remote learning", "hbcus", "hbcu", "non-eng stem", "non-stem total", "emergency", "academic workload", "alienation", "non-eng", "manierre"], "why": "Every paper in the cluster examines the forced shift to emergency remote/online instruction triggered by the COVID-19 pandemic and its downstream effects on engineering education. The distinguishing terms (emergency remote, transition remote, impact covid-, academic workload, alienation, thriving) and the titles (remote learning impact, student alienation narratives, HBCU sense of belonging, instructor pedagogical adaptations, workload perceptions, workplace thriving theory applied to online transition) all orbit the same event: the 2020 emergency pivot from in-person to remote teaching. The cluster is not about remote learning as a general pedagogy but specifically about the pandemic-induced transition and its consequences for students, faculty, and underrepresented institutions (HBCUs, non-STEM contexts)."}, {"id": 12, "label": "Team Dynamics in Flipped Engineering Courses", "n": 6, "colour": "#bcb7ff", "terms": ["cps", "flipped", "hyflex", "member satisfaction", "team conflict", "peer assessment", "idea contributions", "flipped format", "diversity beliefs", "nonflipped"], "why": "The distinguishing terms cluster around two intersecting themes: (1) group/team processes (team conflict, conflict resolution, idea contributions, peer assessment, group performance, groupwork) and (2) instructional format (flipped, nonflipped, hyflex, flipped class, in-person session). The six nearest papers all examine how students function in teams—dynamics, conflict, idea sharing, diversity, collaborative problem solving—within flipped or HyFlex course structures. The combination of social-network/communities-of-practice methods (SNA, COP, CPS) applied to team-level outcomes in a format-specific context makes 'Team Dynamics in Flipped Engineering Courses' the most specific 6-word label that separates this cluster from, say, a purely assessment-focused or curriculum-design cluster."}], "noiseColour": "#8a8984", "nDocs": 402, "nNoise": 97, "mcs": 5, "ari": 0.562, "ariLo": 0.48, "ariHi": 0.668, "seeds": 5, "model": "Qwen/Qwen3-Embedding-8B"}, P = D.points, T = D.topics;
const svg=document.getElementById('svg'), view=document.getElementById('view'),
      tip=document.getElementById('tip'), plot=document.getElementById('plot');
const W=800, H=800, M=26;
const xs=P.map(p=>p.x), ys=P.map(p=>p.y);
const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
const span=Math.max(x1-x0, y1-y0);            // equal scale on both axes: UMAP has no units
const sx=v=>M+(v-x0)/span*(W-2*M)+((W-2*M)-(x1-x0)/span*(W-2*M))/2;
const sy=v=>H-M-(v-y0)/span*(H-2*M)-((H-2*M)-(y1-y0)/span*(H-2*M))/2;
const CO={}; T.forEach(t=>CO[t.id]=t.colour);
const LAB={}; T.forEach(t=>LAB[t.id]=t.label);
const TERMS={}; T.forEach(t=>TERMS[t.id]=t.terms);
const WHY={}; T.forEach(t=>WHY[t.id]=t.why);
const colourOf=p=>p.c<0?D.noiseColour:(CO[p.c]||D.noiseColour);
const yrs=P.map(p=>p.yr).filter(v=>v!=null).sort((a,b)=>a-b);
const yLo=yrs[0], yHi=yrs[yrs.length-1];
const RAMP=['#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
const yearColour=y=>{ if(y==null) return D.noiseColour;
  const f=Math.max(0,Math.min(1,(y-yLo)/Math.max(1,yHi-yLo)));
  return RAMP[Math.round(f*(RAMP.length-1))]; };
document.getElementById('title').textContent=D.title;
document.getElementById('sub').textContent =
  `${D.nDocs} research papers · ${T.length} topics · ${D.nNoise} unclustered`;
let mode='topic', pinned=null, query='', showNoise=false, isolate=null;
let k=1, tx=0, ty=0;
const NS='http://www.w3.org/2000/svg';
const marks=P.map((p,i)=>{ const el=document.createElementNS(NS,'circle');
  el.setAttribute('data-i',i); view.appendChild(el); return el; });
// screen-pixel radius that grows with sqrt(zoom): targets stay tappable as the
// map spreads out, without ballooning. upp converts screen px to svg units.
const upp=()=>W/Math.max(1,svg.getBoundingClientRect().width);
const markerPx=()=>3.2*Math.sqrt(k);
function geometry(){ const r=markerPx()*upp()/k;
  P.forEach((p,i)=>{ const el=marks[i];
    el.setAttribute('cx',sx(p.x)); el.setAttribute('cy',sy(p.y));
    el.setAttribute('r', p.c<0 ? r*0.62 : r);
    el.setAttribute('stroke-width', 0.18*r); });
  if(pinned!=null) marks[pinned].setAttribute('stroke-width', 0.7*markerPx()*upp()/k); }
window.addEventListener('resize', geometry);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function visible(p){
  if(p.c<0 && !showNoise) return false;
  if(isolate!=null && p.c!==isolate) return false;
  const q=query.trim().toLowerCase();
  if(!q) return true;
  return (p.t||'').toLowerCase().includes(q) || (p.a||'').toLowerCase().includes(q)
      || (p.d||'').toLowerCase().includes(q);
}
function paint(){
  P.forEach((p,i)=>{ const el=marks[i], vis=visible(p);
    el.setAttribute('opacity', vis ? (p.c<0?0.42:0.88) : 0.05);
    el.setAttribute('fill', mode==='year'?yearColour(p.yr):colourOf(p));
    el.setAttribute('stroke','var(--panel)'); });
  if(pinned!=null){ const el=marks[pinned]; view.appendChild(el);
    el.setAttribute('stroke','var(--ink)'); el.setAttribute('opacity','1'); }
  geometry();
  document.querySelectorAll('.tchip').forEach(c=>
    c.setAttribute('aria-pressed', String(isolate===Number(c.dataset.c))));
}
function apply(){ view.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`); geometry(); }
function zoomAt(f,px,py){ const nk=Math.max(0.6,Math.min(40,k*f)), r=nk/k;
  tx=px-(px-tx)*r; ty=py-(py-ty)*r; k=nk; apply(); }
function svgPoint(ev){ const r=svg.getBoundingClientRect();
  return [(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height]; }
function nearest(px,py,radiusPx){ const wx=(px-tx)/k, wy=(py-ty)/k, rad=radiusPx/k;
  let best=-1, bd=rad*rad;
  P.forEach((p,i)=>{ if(marks[i].getAttribute('opacity')<0.3) return;
    const dx=sx(p.x)-wx, dy=sy(p.y)-wy, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;} });
  return best; }
const ptrs=new Map(); let downAt=null, moved=false, pinchD=null;
plot.addEventListener('pointerdown',ev=>{ plot.setPointerCapture(ev.pointerId);
  ptrs.set(ev.pointerId,svgPoint(ev)); downAt=svgPoint(ev); moved=false;
  plot.classList.add('drag'); tip.hidden=true;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinchD=Math.hypot(a[0]-b[0],a[1]-b[1]); } });
plot.addEventListener('pointermove',ev=>{ const pt=svgPoint(ev);
  if(!ptrs.has(ev.pointerId)){
    if(ev.pointerType==='mouse'){ const i=nearest(pt[0],pt[1],10*upp()*Math.sqrt(k));
      if(i<0){tip.hidden=true;return;} const p=P[i], r=plot.getBoundingClientRect();
      tip.innerHTML=`<b>${esc(p.t).slice(0,90)}</b><br>${p.yr??''} · ${esc(p.c<0?'unclustered':LAB[p.c])}`;
      tip.hidden=false;
      tip.style.left=Math.min(ev.clientX-r.left+12,r.width-270)+'px';
      tip.style.top=(ev.clientY-r.top+12)+'px'; }
    return; }
  const prev=ptrs.get(ev.pointerId); ptrs.set(ev.pointerId,pt);
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinchD) zoomAt(d/pinchD,(a[0]+b[0])/2,(a[1]+b[1])/2);
    pinchD=d; moved=true; return; }
  const dx=pt[0]-prev[0], dy=pt[1]-prev[1];
  if(Math.hypot(pt[0]-downAt[0],pt[1]-downAt[1])>6) moved=true;
  if(moved){ tx+=dx; ty+=dy; apply(); } });
function up(ev){ const pt=ptrs.get(ev.pointerId); ptrs.delete(ev.pointerId); pinchD=null;
  if(ptrs.size===0) plot.classList.remove('drag');
  if(pt && !moved && ptrs.size===0){
    // a fingertip is not a cursor: 22px against a mouse click's 10
    const i=nearest(pt[0],pt[1],(ev.pointerType==='touch'?22:10)*upp()*Math.sqrt(k));
    pinned=(i<0||i===pinned)?null:i; paint();
    if(pinned!=null){ detail(pinned);
      document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'start'}); }
    else document.getElementById('detail').innerHTML =
      '<h3>Paper</h3><p class="empty">Tap a point to see its paper. Tap a topic below to isolate it.</p>'; } }
plot.addEventListener('pointerup',up); plot.addEventListener('pointercancel',up);
plot.addEventListener('mouseleave',()=>{tip.hidden=true;});
plot.addEventListener('wheel',ev=>{ ev.preventDefault(); const [px,py]=svgPoint(ev);
  zoomAt(ev.deltaY<0?1.2:1/1.2,px,py); },{passive:false});
document.getElementById('zin').addEventListener('click',()=>zoomAt(1.5,W/2,H/2));
document.getElementById('zout').addEventListener('click',()=>zoomAt(1/1.5,W/2,H/2));
document.getElementById('reset').addEventListener('click',()=>{k=1;tx=0;ty=0;isolate=null;apply();paint();});
function detail(i){ const p=P[i], named=p.c>=0;
  document.getElementById('detail').innerHTML=`<h3>Paper</h3>
  <h2>${esc(p.t||'(title unavailable)')}</h2>
  <div>${named?`<span class="pill" style="background:${CO[p.c]}">${esc(LAB[p.c])}</span>`
               :'<span class="pill" style="background:var(--noise)">unclustered</span>'}</div>
  <dl><dt>Authors</dt><dd>${esc(p.a||'—')}</dd>
  <dt>Published</dt><dd>${p.yr??'—'}</dd>
  <dt>Type</dt><dd>${esc(p.dt||'—')}</dd>
  <dt>Citations</dt><dd>${p.nc??'—'}</dd>
  <dt>DOI</dt><dd><a href="https://doi.org/${esc(p.d)}" target="_blank" rel="noopener">${esc(p.d)}</a></dd></dl>
  ${named?`<p class="terms"><b>Topic terms:</b> ${esc(TERMS[p.c].join(', '))}</p>`:''}`; }
const L=document.getElementById('legend');
L.innerHTML=T.map(t=>`<button type="button" class="tchip" data-c="${t.id}" aria-pressed="false">
  <span class="sw" style="background:${t.colour}"></span>${esc(t.label)} <span class="n">${t.n}</span></button>`).join('');
L.querySelectorAll('.tchip').forEach(c=>c.addEventListener('click',()=>{
  const id=Number(c.dataset.c); isolate=(isolate===id)?null:id; pinned=null; paint(); }));
document.querySelectorAll('input[name=mode]').forEach(el=>
  el.addEventListener('change',e=>{mode=e.target.value;paint();}));
document.getElementById('noise').addEventListener('change',e=>{showNoise=e.target.checked;paint();});
document.getElementById('q').addEventListener('input',e=>{query=e.target.value;paint();});
document.getElementById('foot').innerHTML =
  `Every research article, review and research review published in the <b>Journal of Engineering Education</b> `
  + `from 2015 to 2026 (${D.nDocs} papers), full text embedded with ${esc(D.model)} using length-weighted `
  + `chunk pooling, laid out by UMAP on cosine distance and clustered with HDBSCAN `
  + `(min_cluster_size=${D.mcs}). Topic names were written by a local Qwen3.8-27B from each cluster's `
  + `distinguishing terms and its most central papers. `
  + `<b>Clustering is only moderately stable:</b> mean adjusted Rand index ${D.ari} `
  + `(range ${D.ariLo}–${D.ariHi}) across ${D.seeds} UMAP seeds, so roughly a third of `
  + `cluster assignments shift with the random seed alone — read the boundaries as soft. `
  + `${D.nNoise} papers were left unclustered. Drag to pan, pinch or scroll to zoom, tap a point for its paper.`;
paint(); apply();
</script>

</body>
</html>
